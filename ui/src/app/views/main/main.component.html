<div class="flex flex-col justify-between px-4 sm:px-8 lg:px-16 py-8 lg:py-12 w-full h-full">
  <!-- Hero text — 60% width -->
  <div class="w-full lg:w-3/5 mb-8">
    <div class="font-code text-caption uppercase tracking-[0.2em] text-(--accent) mb-2">
      Origin // Argentina
    </div>
    <h1 class="font-serif text-5xl font-bold text-fg leading-tight tracking-tight mb-4">
      {{ name }}
    </h1>
    <p class="text-body-1 text-dim leading-relaxed mb-5">{{ bio }}</p>
    <div class="flex flex-row items-start gap-14">
      <a
        [href]="'mailto:' + email"
        class="font-code text-body-1 font-bold text-br-main! no-underline hover:underline tracking-wide"
      >
        {{ email }}
      </a>
      <div class="flex items-center gap-4">
        <a
          [href]="linkedin"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-1.5 font-code text-caption text-br-main! no-underline hover:underline transition-colors"
        >
          <span class="material-symbols-outlined text-[16px] leading-none">work</span>
          LinkedIn
        </a>
        <a
          [href]="github"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-1.5 font-code text-caption text-br-main! no-underline hover:underline transition-colors"
        >
          <span class="material-symbols-outlined text-[16px] leading-none">code_blocks</span>
          GitHub
        </a>
      </div>
    </div>
  </div>

  <!-- Terminal card — 60% width, right-aligned -->
  <div class="w-full lg:w-1/2 lg:ml-auto mb-4 bg-surface border border-rim shadow-xl">
    <!-- Title bar -->
    <div class="flex items-center justify-between px-3 py-2.5 border-b border-rim">
      <div class="flex gap-1.5">
        <div class="w-2.5 h-2.5 rounded-full bg-red-400/50"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-yellow-400/40"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-green-400/25"></div>
      </div>
      <span class="font-code text-caption text-muted">seba&#64;reality: ~</span>
    </div>
    <!-- Terminal body -->
    <div class="font-code text-body-2 p-4 space-y-1">
      <p class="text-(--accent)">$ whoami</p>
      <p class="text-dim">{{ name }}</p>
      <p class="text-(--accent) mt-3">$ cat profile.json</p>
      <p class="text-fg">"role": "FullStack Developer"</p>
      <p class="text-fg">"focus": ["Angular", "Node", "Flutter"]</p>
      <div class="flex items-center gap-1 mt-3">
        <span class="text-(--accent)">$</span>
        <span class="w-2 h-4 bg-(--accent) animate-pulse inline-block"></span>
      </div>
    </div>
  </div>
</div>
