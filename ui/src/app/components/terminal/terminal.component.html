<div class="bg-surface border-t border-rim font-code text-body-2 shrink-0">
  <div class="flex items-center justify-between px-3 py-1.5 border-b border-rim">
    <span class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded-full bg-[#ff5f57] inline-block opacity-60"></span>
      <span class="w-3 h-3 rounded-full bg-[#febc2e] inline-block opacity-60"></span>
      <span class="w-3 h-3 rounded-full bg-[#28c840] inline-block opacity-60"></span>
      <span class="text-muted text-xs ml-1">terminal</span>
    </span>
    <button
      class="bg-transparent border-0 text-muted cursor-pointer text-xs px-1.5 py-0.5 hover:text-fg"
      (click)="toggleCollapse()"
      [attr.aria-label]="isCollapsed() ? 'Expand terminal' : 'Collapse terminal'"
    >
      {{ isCollapsed() ? '▲' : '▼' }}
    </button>
  </div>

  @if (!isCollapsed()) {
    <div #scrollContainer class="px-3 py-2 max-h-45 overflow-y-auto flex flex-col gap-1">
      <div class="flex flex-col gap-1.5">
        @for (entry of history(); track entry.timestamp) {
          <div class="flex flex-col gap-0.5">
            <div class="text-fg"><span class="text-br-main">$</span> {{ entry.input }}</div>
            <pre class="text-muted whitespace-pre-wrap m-0 text-xs font-code">{{
              entry.output
            }}</pre>
          </div>
        }
      </div>
      <div class="flex items-center gap-2 mt-1">
        <span class="text-br-main select-none">$</span>
        <input
          class="flex-1 bg-transparent border-0 outline-none text-fg font-code text-body-2 caret-br-main placeholder:text-muted placeholder:opacity-50"
          type="text"
          [(ngModel)]="currentInput"
          (keyup.enter)="onSubmit()"
          (keydown.tab)="onTab($event)"
          placeholder="git checkout visual"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>
  }
</div>
